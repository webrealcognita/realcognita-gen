<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Realcognita layered-hexagon mark. Vector + fully transparent, so it stays
       crisp and background-free in every tab, at every zoom, light or dark. -->
  <defs>
    <linearGradient id="rc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00A499"/>
      <stop offset="1" stop-color="#26D07C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#rc)" stroke-width="4.2" stroke-linejoin="round">
    <polygon points="32,6 53,18 53,34 32,46 11,34 11,18" opacity=".95"/>
    <polygon points="32,18 53,30 53,38 32,50 11,38 11,30" opacity=".7"/>
    <polygon points="32,30 53,42 53,46 32,58 11,46 11,42" opacity=".45"/>
  </g>
</svg>
